name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Cross-compile check
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: make build
      # run_e2e.sh brings up its own mysql containers via docker compose
      - name: E2E
        run: bash e2e/run_e2e.sh
